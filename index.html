<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iceland 7-Day Plan</title>
  <style>
    :root {
      --bg: #0b1220;
      --surface: #151e2e;
      --surface-2: #1e293b;
      --surface-3: #273549;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --nature: #34d399;
      --culture: #a78bfa;
      --food: #fb923c;
      --relax: #f472b6;
      --drive: #64748b;
      --border: #2a3548;
      --shadow: 0 4px 20px rgba(0,0,0,0.4);
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      background: linear-gradient(135deg, #0c4a6e, #1e3a5f 60%, #0b1220);
      padding: 0.75rem 1.1rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem;
      justify-content: space-between;
    }
    header h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.02em; }
    .header-actions { display: flex; gap: 0.45rem; flex-wrap: wrap; align-items: center; }
    .btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { background: var(--accent); color: #0b1220; border-color: var(--accent); }
    .btn.primary {
      background: rgba(56,189,248,0.15);
      color: var(--accent);
      border-color: rgba(56,189,248,0.35);
    }
    .btn.active-toggle {
      background: rgba(52,211,153,0.18);
      color: var(--nature);
      border-color: rgba(52,211,153,0.4);
    }

    .pool-top {
      padding: 0.35rem 0.65rem 0.45rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .pool-top-inner {
      background: var(--surface-2);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 0.3rem 0.45rem 0.35rem;
    }
    .pool-top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      margin-bottom: 0.25rem;
    }
    .pool-top-header h2 {
      font-size: 0.72rem;
      font-weight: 650;
      color: var(--text-muted);
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .pool-slot-wrap {
      border-radius: 6px;
      transition: background 0.15s, border-color 0.15s;
      border: 1px solid transparent;
      padding: 0.1rem 0;
    }
    .pool-slot-wrap.drag-over {
      background: rgba(56,189,248,0.12);
      border-color: var(--accent);
    }
    .pool-cards-row {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: flex-start;
      gap: 0.35rem;
      max-height: calc(3 * 2.6rem + 2 * 0.3rem); /* ~3 rows */
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }
    
    /* each “page” = one column of up to 3 cards */
    .pool-col-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      flex-shrink: 0;
      width: 120px;
    }
    
    .pool-cards-row .memo {
      width: 120px;
      min-width: 120px;
      max-width: 120px;
      flex-shrink: 0;
      padding: 0.25rem 0.4rem;
      border-left-width: 3px;
      box-sizing: border-box;
    }
    
    .pool-cards-row .memo .memo-title {
      font-size: 0.7rem;
      line-height: 1.25;
      margin-bottom: 0;
    }
    
    .pool-cards-row .memo .memo-note,
    .pool-cards-row .memo .memo-tags { display: none; }
    
    .pool-cards-row .memo .memo-time {
      font-size: 0.58rem;
      margin-bottom: 0.05rem;
    }
    .pool-cards-row .memo .memo-actions { top: 0.1rem; right: 0.15rem; }
    .pool-cards-row .memo .memo-btn { width: 14px; height: 14px; font-size: 0.6rem; }

    /* 50px tall horizontal scrollbar under Unassigned */
    .board-hscroll {
      height: 50px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 0.65rem;
      gap: 0.5rem;
    }
    .board-hscroll-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      flex-shrink: 0;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .board-hscroll-track {
      flex: 1;
      height: 36px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: auto;
      scrollbar-color: var(--accent) var(--surface-2);
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .board-hscroll-track::-webkit-scrollbar {
      height: 28px;
    }
    .board-hscroll-track::-webkit-scrollbar-track {
      background: var(--surface-2);
      border-radius: 8px;
    }
    .board-hscroll-track::-webkit-scrollbar-thumb {
      background: linear-gradient(90deg, #0ea5e9, var(--accent));
      border-radius: 8px;
      border: 4px solid var(--surface-2);
      min-width: 64px;
    }
    .board-hscroll-track::-webkit-scrollbar-thumb:hover {
      background: #7dd3fc;
    }
    .board-hscroll-spacer {
      height: 1px;
      /* width set in JS to match board scrollWidth */
    }

    .board-wrap {
      overflow-x: auto;
      overflow-y: auto;
      padding: 0.65rem 0.85rem 1.1rem;
      height: calc(100vh - 200px);
      min-height: 240px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--surface-2);
    }
    .board-wrap::-webkit-scrollbar {
      height: 10px;
      width: 10px;
    }
    .board-wrap::-webkit-scrollbar-track {
      background: var(--surface-2);
    }
    .board-wrap::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 6px;
    }
    .board {
      display: flex;
      gap: 0.7rem;
      min-width: max-content;
      height: auto;
      align-items: flex-start;
      padding-bottom: 0.5rem;
    }

    .day-col {
      width: 260px;
      flex-shrink: 0;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: auto;
      max-height: none;
    }
    .day-col-header {
      padding: 0.7rem 0.75rem;
      background: linear-gradient(90deg, rgba(56,189,248,0.12), transparent);
      border-bottom: 1px solid var(--border);
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .day-col-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.35rem;
    }
    .day-col-header h2 {
      font-size: 0.9rem;
      font-weight: 650;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex: 1;
      min-width: 0;
    }
    .day-move-btns {
      display: flex;
      gap: 0.15rem;
      flex-shrink: 0;
    }
    .day-move-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 24px;
      height: 24px;
      border-radius: 6px;
      font-size: 0.7rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .day-move-btn:hover:not(:disabled) {
      background: var(--accent);
      color: #0b1220;
      border-color: var(--accent);
    }
    .day-move-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .day-num {
      background: var(--accent);
      color: #0b1220;
      width: 1.55rem;
      height: 1.55rem;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .day-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }
    .day-title-edit, .day-sub-edit {
      outline: none;
      border-radius: 4px;
      padding: 0 0.15rem;
      cursor: text;
    }
    .day-title-edit:hover, .day-sub-edit:hover {
      background: rgba(56,189,248,0.1);
    }
    .day-title-edit:focus, .day-sub-edit:focus {
      background: rgba(56,189,248,0.18);
      box-shadow: 0 0 0 1px var(--accent);
    }
    h2 .day-title-edit {
      font-size: inherit;
      font-weight: inherit;
    }

    .slots {
      flex: 1;
      overflow-y: visible;
      padding: 0.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .slot {
      background: var(--surface-2);
      border: 1px dashed var(--border);
      border-radius: 8px;
      min-height: auto;
      padding: 0.4rem;
      transition: background 0.15s, border-color 0.15s;
    }
    .slot.drag-over {
      background: rgba(56,189,248,0.12);
      border-color: var(--accent);
      border-style: solid;
    }
    .slot-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
      padding: 0 0.1rem;
    }
    .slot-cards {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-height: 28px;
    }

    .memo {
      background: var(--surface-3);
      border-left: 4px solid var(--accent);
      border-radius: 6px;
      padding: 0.45rem 0.55rem;
      cursor: grab;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      transition: transform 0.12s, box-shadow 0.12s, opacity 0.12s;
      user-select: none;
      position: relative;
    }
    .memo:active { cursor: grabbing; }
    .memo.dragging { opacity: 0.55; transform: scale(0.97); }
    .memo.nature { border-left-color: var(--nature); }
    .memo.culture { border-left-color: var(--culture); }
    .memo.food { border-left-color: var(--food); }
    .memo.relax { border-left-color: var(--relax); }
    .memo.drive { border-left-color: var(--drive); }

    .memo-time {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.12rem;
    }
    .memo-title {
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 0.08rem;
    }
    .memo-note {
      font-size: 0.68rem;
      color: var(--text-muted);
      line-height: 1.35;
    }
    .memo-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.2rem;
      margin-top: 0.25rem;
    }
    .memo-tag {
      font-size: 0.58rem;
      padding: 0.08rem 0.35rem;
      border-radius: 999px;
      font-weight: 500;
      background: rgba(255,255,255,0.06);
      color: var(--text-muted);
    }
    .memo-actions {
      position: absolute;
      top: 0.2rem;
      right: 0.25rem;
      display: none;
      gap: 0.12rem;
    }
    .memo:hover .memo-actions { display: flex; }
    .memo-btn {
      background: rgba(0,0,0,0.35);
      border: none;
      color: var(--text-muted);
      width: 16px;
      height: 16px;
      border-radius: 4px;
      font-size: 0.65rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .memo-btn:hover { color: #fff; background: rgba(0,0,0,0.55); }

    .add-btn {
      width: auto;
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--text-muted);
      padding: 0.15rem 0.45rem;
      border-radius: 5px;
      font-size: 0.68rem;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .add-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(56,189,248,0.06);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow);
    }
    .modal h3 { font-size: 1.05rem; margin-bottom: 1rem; }
    .form-group { margin-bottom: 0.85rem; }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.65rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }
    .form-group textarea { min-height: 60px; resize: vertical; }
    .form-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .summary-modal .modal {
      max-width: 480px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }
    .summary-modal textarea {
      width: 100%;
      min-height: 280px;
      max-height: 55vh;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      line-height: 1.45;
      resize: vertical;
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface-3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 1.2rem;
      border-radius: 8px;
      font-size: 0.85rem;
      z-index: 200;
      transition: transform 0.25s;
      box-shadow: var(--shadow);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 700px) {
      .day-col { width: 240px; }
      header h1 { font-size: 1.05rem; }
      .board-wrap { height: calc(100vh - 190px); }
    }
    @media print {
      .header-actions, .memo-actions, .day-move-btns, .pool-top-header .add-btn, .board-hscroll { display: none !important; }
      .board-wrap { overflow: visible; height: auto; }
      .board { flex-wrap: wrap; }
      .day-col { break-inside: avoid; max-height: none; }
      .slots { overflow: visible; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="plan-title">🇮🇸 Iceland 7-Day Plan</h1>
    </div>
    <div class="header-actions">
      <button class="btn" id="btn-day-mode" onclick="toggleDayMode()">8-day (+ empty)</button>
      <button class="btn" onclick="resetBoard()">Reset</button>
      <button class="btn primary" onclick="exportSummary()">Export summary</button>
      <button class="btn primary" onclick="openImportModal()">Import summary</button>
      <button class="btn primary" onclick="exportImage()">Export PNG</button>
    </div>
  </header>

  <div class="pool-top" id="pool-top">
    <div class="pool-top-inner">
      <div class="pool-top-header">
        <h2>📋 Unassigned</h2>
        <button class="add-btn" onclick="openAddModal('pool', 'pool')">+ New</button>
      </div>
      <div class="pool-slot-wrap slot" data-day-id="pool" data-period="pool" id="pool-slot">
        <div class="pool-cards-row slot-cards" data-day="pool" data-period="pool" id="pool-cards"></div>
      </div>
    </div>
  </div>

  <!-- 50px horizontal scrollbar synced with board -->
  <div class="board-hscroll" id="board-hscroll">
    <span class="board-hscroll-label">Scroll</span>
    <div class="board-hscroll-track" id="board-hscroll-track">
      <div class="board-hscroll-spacer" id="board-hscroll-spacer"></div>
    </div>
  </div>

  <div class="board-wrap" id="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 id="modal-title">Edit activity</h3>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="f-title" placeholder="e.g. Seljalandsfoss" />
      </div>
      <div class="form-group">
        <label>Note</label>
        <textarea id="f-note" placeholder="Optional short note"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Start time (optional)</label>
          <input type="time" id="f-start" />
        </div>
        <div class="form-group">
          <label>End time (optional)</label>
          <input type="time" id="f-end" />
        </div>
      </div>
      <div class="form-group">
        <label>Type</label>
        <select id="f-type">
          <option value="nature">Nature</option>
          <option value="culture">Culture</option>
          <option value="food">Food</option>
          <option value="relax">Relax</option>
          <option value="drive">Transit</option>
        </select>
      </div>
      <div class="form-group">
        <label>Section</label>
        <select id="f-period">
          <option value="am">AM</option>
          <option value="pm">PM</option>
        </select>
      </div>
      <div class="form-actions">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn primary" onclick="saveMemo()">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay summary-modal" id="summary-modal">
    <div class="modal">
      <h3>Plan summary</h3>
      <p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:0.65rem;">Copy and paste into a message or notes.</p>
      <textarea id="summary-text" readonly></textarea>
      <div class="form-actions">
        <button class="btn" onclick="closeSummaryModal()">Close</button>
        <button class="btn primary" onclick="copySummary()">Copy to clipboard</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay summary-modal" id="import-modal">
    <div class="modal">
      <h3>Import summary</h3>
      <p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:0.65rem;">Paste a previously exported summary. This replaces the current plan.</p>
      <textarea id="import-text" placeholder="Paste summary text here…"></textarea>
      <div class="form-actions">
        <button class="btn" onclick="closeImportModal()">Cancel</button>
        <button class="btn primary" onclick="importSummary()">Import</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const PERIODS = [
      { id: 'am', label: 'AM · Morning' },
      { id: 'pm', label: 'PM · Afternoon / Evening' },
    ];

    /* Trip starts 21 Nov. Day N → 20+N November. */
    const TRIP_START = { y: 2025, m: 10, d: 21 }; // month 0-indexed: 10 = Nov

    const DAYS_7 = [
      { id: 'd1', num: 1, label: 'Arrival', sub: 'Reykjavík' },
      { id: 'd2', num: 2, label: 'South Coast D1', sub: 'Skaftafell area' },
      { id: 'd3', num: 3, label: 'South Coast D2', sub: 'Return Reykjavík' },
      { id: 'd4', num: 4, label: 'City', sub: 'Reykjavík' },
      { id: 'd5', num: 5, label: 'Golden Coast', sub: 'Reykjavík' },
      { id: 'd6', num: 6, label: 'City', sub: 'Reykjavík' },
      { id: 'd7', num: 7, label: 'Departure 11:55', sub: 'Airport by 09:55' },
    ];

    const EXTRA_DAY = {
      id: 'd-extra',
      num: 7,
      label: 'Extra day',
      sub: 'Free / flexible'
    };

    /* South Coast pair — always move together, D1 before D2 */
    const SC_PAIR = ['d2', 'd3'];

    const DEFAULT_MEMOS = [
      { id: 'm1', dayId: 'd1', period: 'am', title: 'Land KEF 10:50', note: 'Clearance ~40 min + Flybus ~50 min', type: 'drive', start: '10:50', end: '12:25' },
      { id: 'm2', dayId: 'd1', period: 'pm', title: 'Check-in + lunch', note: '', type: 'food', start: '13:00', end: '' },
      { id: 'm4', dayId: 'd1', period: 'pm', title: 'National Museum of Iceland', note: '', type: 'culture', start: '', end: '' },
      { id: 'm5', dayId: 'd1', period: 'pm', title: 'Kaffihús Vesturbæjar', note: 'Melhagi 20, 107 Reykjavík', type: 'relax', start: '', end: '' },
      { id: 'm6', dayId: 'd1', period: 'pm', title: 'How to become Icelandic in 60 min', note: 'Harpa · Kaldalón', type: 'culture', start: '19:00', end: '20:00' },
      { id: 'm7', dayId: 'd1', period: 'pm', title: 'Dinner', note: '', type: 'food', start: '', end: '' },

      { id: 'tour-sc1', dayId: 'd2', period: 'am', title: '★ 2-Day South Coast + Ice Cave', note: '2-day · Pickup 09:00 · South coast day', type: 'nature', start: '09:00', end: '' },

    let memos = [];

    function dateForDayNum(num) {
      // Day 1 = 21 Nov, Day 2 = 22 Nov, … Day 8 = 28 Nov
      const dt = new Date(TRIP_START.y, TRIP_START.m, TRIP_START.d + (num - 1));
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return dt.getDate() + ' ' + months[dt.getMonth()];
    }

    /** Keep title = "DD Mon · label" tied to day number */
    function syncDayTitles() {
      days.forEach((d, i) => {
        d.num = i + 1;
        const dateStr = dateForDayNum(d.num);
        // Preserve thematic label (Arrival, South Coast D1, …)
        const label = d.label || stripDateFromTitle(d.title) || 'Day';
        d.label = label;
        d.title = dateStr + ' · ' + label;
      });
    }

    function stripDateFromTitle(title) {
      if (!title) return '';
      // "21 Nov · Arrival" → "Arrival"
      const m = title.match(/^\d{1,2}\s+[A-Za-z]{3}\s*[·•.\-]\s*(.+)$/);
      return m ? m[1].trim() : title;
    }

    function loadState() {
      try {
        const saved = localStorage.getItem('iceland-kanban-v14');
        if (saved) {
          const data = JSON.parse(saved);
          memos = data.memos || data;
          planLength = data.planLength === 8 ? 8 : 7;
          if (data.days) {
            days = data.days;
            days.forEach(d => {
              if (!d.label) d.label = stripDateFromTitle(d.title);
            });
          } else {
            days = buildDaysFromLength(planLength);
          }
          ensureSouthCoastPairOrder();
          syncDayTitles();
          return;
        }
      } catch (e) {}
      memos = JSON.parse(JSON.stringify(DEFAULT_MEMOS));
      planLength = 7;
      days = buildDaysFromLength(7);
      syncDayTitles();
    }
    function saveState() {
      localStorage.setItem('iceland-kanban-v14', JSON.stringify({ memos, days, planLength }));
    }
    function uid() {
      return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function buildDaysFromLength(len) {
      const base = JSON.parse(JSON.stringify(DAYS_7));
      if (len === 8) {
        const dep = base.pop();
        const extra = JSON.parse(JSON.stringify(EXTRA_DAY));
        base.push(extra);
        base.push(dep);
      }
      ensureSouthCoastPairOrder(base);
      base.forEach((d, i) => {
        d.num = i + 1;
        d.label = d.label || stripDateFromTitle(d.title);
      });
      return base;
    }

    /** Ensure d2 (SC D1) is immediately before d3 (SC D2) */
    function ensureSouthCoastPairOrder(list) {
      const arr = list || days;
      const i1 = arr.findIndex(d => d.id === 'd2');
      const i2 = arr.findIndex(d => d.id === 'd3');
      if (i1 < 0 || i2 < 0) return;
      if (i2 === i1 + 1) return; // already consecutive D1 then D2
      // Pull pair out and reinsert with D1 first
      const a = arr[i1];
      const b = arr[i2];
      // remove higher index first
      if (i2 > i1) {
        arr.splice(i2, 1);
        arr.splice(i1, 1);
        arr.splice(i1, 0, a, b);
      } else {
        arr.splice(i1, 1);
        arr.splice(i2, 1);
        arr.splice(i2, 0, a, b);
      }
    }

    function updateTitleAndToggle() {
      const t = document.getElementById('plan-title');
      const btn = document.getElementById('btn-day-mode');
      t.textContent = planLength === 8 ? '🇮🇸 Iceland 8-Day Plan' : '🇮🇸 Iceland 7-Day Plan';
      if (planLength === 8) {
        btn.textContent = '7-day mode';
        btn.classList.add('active-toggle');
      } else {
        btn.textContent = '8-day (+ empty)';
        btn.classList.remove('active-toggle');
      }
    }

    function toggleDayMode() {
      if (planLength === 7) {
        const depIdx = days.findIndex(d => d.id === 'd7' || /departure/i.test(d.label || d.title));
        const insertAt = depIdx >= 0 ? depIdx : days.length - 1;
        if (!days.some(d => d.id === 'd-extra')) {
          const extra = JSON.parse(JSON.stringify(EXTRA_DAY));
          days.splice(insertAt, 0, extra);
        }
        planLength = 8;
      } else {
        const extraIdx = days.findIndex(d => d.id === 'd-extra');
        if (extraIdx >= 0) {
          memos.forEach(m => {
            if (m.dayId === 'd-extra') {
              m.dayId = 'pool';
              m.period = 'pool';
            }
          });
          days.splice(extraIdx, 1);
        }
        planLength = 7;
      }
      ensureSouthCoastPairOrder();
      syncDayTitles();
      saveState();
      updateTitleAndToggle();
      renderBoard();
      showToast(planLength === 8 ? '8-day: Day 8 = ' + dateForDayNum(8) : '7-day: Day 7 = ' + dateForDayNum(7));
    }

    function formatTimeRange(start, end) {
      if (!start && !end) return '';
      if (start && end) return start + ' – ' + end;
      if (start) return 'from ' + start;
      return 'until ' + end;
    }

    function createMemoEl(m) {
      const el = document.createElement('div');
      el.className = 'memo ' + m.type;
      el.draggable = true;
      el.dataset.id = m.id;
      const timeStr = formatTimeRange(m.start, m.end);
      el.innerHTML = `
        <div class="memo-actions">
          <button class="memo-btn" title="Edit" onclick="event.stopPropagation(); openEditModal('${m.id}')">✎</button>
          <button class="memo-btn" title="Delete" onclick="event.stopPropagation(); deleteMemo('${m.id}')">×</button>
        </div>
        ${timeStr ? `<div class="memo-time">${timeStr}</div>` : ''}
        <div class="memo-title">${escapeHtml(m.title)}</div>
        ${m.note ? `<div class="memo-note">${escapeHtml(m.note)}</div>` : ''}
        <div class="memo-tags"><span class="memo-tag">${m.type}</span></div>
      `;
      el.addEventListener('dragstart', onDragStart);
      el.addEventListener('dragend', onDragEnd);
      return el;
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str || '';
      return d.innerHTML;
    }

    function sortByIdSequence(list) {
      return list.slice().sort((a, b) => {
        const ia = memos.findIndex(m => m.id === a.id);
        const ib = memos.findIndex(m => m.id === b.id);
        return ia - ib;
      });
    }

    function renderPool() {
      const poolCards = document.getElementById('pool-cards');
      if (!poolCards) return;
      poolCards.innerHTML = '';
    
      const list = sortByIdSequence(memos.filter(m => m.dayId === 'pool'));
      const PER_COL = 3;
    
      for (let i = 0; i < list.length; i += PER_COL) {
        const col = document.createElement('div');
        col.className = 'pool-col-group';
        list.slice(i, i + PER_COL).forEach(m => {
          col.appendChild(createMemoEl(m));
        });
        poolCards.appendChild(col);
      }
    }

    function renderBoard() {
      syncDayTitles();
      const board = document.getElementById('board');
      board.innerHTML = '';

      days.forEach((day, dayIndex) => {
        const col = document.createElement('div');
        col.className = 'day-col';
        col.dataset.dayId = day.id;
        const canLeft = dayIndex > 0;
        const canRight = dayIndex < days.length - 1;
        col.innerHTML = `
          <div class="day-col-header">
            <div class="day-col-header-row">
              <h2>
                <span class="day-num">${day.num}</span>
                <span class="day-title-edit" contenteditable="true" data-day-id="${day.id}" data-field="label" spellcheck="false">${escapeHtml(day.title)}</span>
              </h2>
              <div class="day-move-btns">
                <button class="day-move-btn" title="Move day left" ${canLeft ? '' : 'disabled'} onclick="moveDay('${day.id}', -1)">←</button>
                <button class="day-move-btn" title="Move day right" ${canRight ? '' : 'disabled'} onclick="moveDay('${day.id}', 1)">→</button>
              </div>
            </div>
            <div class="day-sub day-sub-edit" contenteditable="true" data-day-id="${day.id}" data-field="sub" spellcheck="false">${escapeHtml(day.sub)}</div>
          </div>
          <div class="slots" id="slots-${day.id}"></div>
        `;
        col.querySelectorAll('[contenteditable]').forEach(el => {
          el.addEventListener('blur', () => {
            const id = el.dataset.dayId;
            const field = el.dataset.field;
            const d = days.find(x => x.id === id);
            if (!d) return;
            if (field === 'label') {
              // User may edit full "21 Nov · Arrival" or just label — store label only; date reapplied
              const raw = el.textContent.trim();
              d.label = stripDateFromTitle(raw) || raw;
              syncDayTitles();
              el.textContent = d.title;
            } else {
              d[field] = el.textContent.trim();
            }
            saveState();
          });
          el.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
          });
        });
        board.appendChild(col);

        const slotsEl = col.querySelector('.slots');
        PERIODS.forEach(period => {
          const slotDiv = document.createElement('div');
          slotDiv.className = 'slot';
          slotDiv.dataset.dayId = day.id;
          slotDiv.dataset.period = period.id;
          slotDiv.innerHTML = `
            <div class="slot-label">${period.label}</div>
            <div class="slot-cards" data-day="${day.id}" data-period="${period.id}"></div>
          `;
          slotDiv.addEventListener('dragover', onDragOver);
          slotDiv.addEventListener('dragleave', onDragLeave);
          slotDiv.addEventListener('drop', onDrop);
          slotsEl.appendChild(slotDiv);

          const cardsEl = slotDiv.querySelector('.slot-cards');
          const list = sortByIdSequence(
            memos.filter(m => m.dayId === day.id && m.period === period.id)
          );
          list.forEach(m => cardsEl.appendChild(createMemoEl(m)));
        });
      });

      renderPool();
      updateTitleAndToggle();
      requestAnimationFrame(updateHScrollSpacer);
    }

    /**
     * Move day; South Coast D1+D2 always move as one block (D1 then D2).
     */
    function moveDay(dayId, direction) {
      ensureSouthCoastPairOrder();
      const isSC = SC_PAIR.includes(dayId);

      if (isSC) {
        // Move the whole pair as a unit
        let i1 = days.findIndex(d => d.id === 'd2');
        let i2 = days.findIndex(d => d.id === 'd3');
        if (i1 < 0 || i2 < 0) return;
        if (i2 !== i1 + 1) {
          ensureSouthCoastPairOrder();
          i1 = days.findIndex(d => d.id === 'd2');
          i2 = days.findIndex(d => d.id === 'd3');
        }
        const pair = days.splice(i1, 2);
        let newStart = i1 + direction;
        // Clamp so pair fits
        if (newStart < 0) newStart = 0;
        if (newStart > days.length) newStart = days.length;
        days.splice(newStart, 0, pair[0], pair[1]);
      } else {
        const idx = days.findIndex(d => d.id === dayId);
        if (idx < 0) return;
        const newIdx = idx + direction;
        if (newIdx < 0 || newIdx >= days.length) return;

        // Don't split SC pair: if swapping into the middle of the pair, move past the pair
        const other = days[newIdx];
        if (other && SC_PAIR.includes(other.id)) {
          // Jump over the pair
          const i1 = days.findIndex(d => d.id === 'd2');
          const target = direction > 0 ? i1 + 2 : i1 - 1;
          if (target < 0 || target >= days.length) {
            // can't move
            ensureSouthCoastPairOrder();
            syncDayTitles();
            return;
          }
          const [item] = days.splice(idx, 1);
          // recompute insert after removal
          let insertAt = days.findIndex(d => d.id === 'd2');
          if (direction > 0) insertAt = insertAt + 2;
          // if we removed item before pair, indices shifted
          if (idx < i1 && direction > 0) {
            // already handled by splice
          }
          days.splice(Math.max(0, Math.min(days.length, insertAt)), 0, item);
        } else {
          const tmp = days[idx];
          days[idx] = days[newIdx];
          days[newIdx] = tmp;
        }
      }

      ensureSouthCoastPairOrder();
      syncDayTitles();
      saveState();
      renderBoard();
      showToast(direction < 0 ? 'Moved left' : 'Moved right');
    }

    function onDragStart(e) {
      draggedId = e.target.dataset.id;
      e.target.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', draggedId);
    }
    function onDragEnd(e) {
      e.target.classList.remove('dragging');
      document.querySelectorAll('.slot').forEach(s => s.classList.remove('drag-over'));
      draggedId = null;
    }
    function onDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      e.currentTarget.classList.add('drag-over');
    }
    function onDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }
    function onDrop(e) {
      e.preventDefault();
      const slot = e.currentTarget;
      slot.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain') || draggedId;
      if (!id) return;
      const dayId = slot.dataset.dayId;
      const period = slot.dataset.period;
      const memo = memos.find(m => m.id === id);
      if (!memo) return;
      memo.dayId = dayId;
      memo.period = period === 'pool' ? 'pool' : period;
      if (dayId === 'pool') memo.period = 'pool';
      saveState();
      renderBoard();
      showToast('Moved: ' + memo.title);
    }

    function openEditModal(id) {
      const m = memos.find(x => x.id === id);
      if (!m) return;
      editingId = id;
      addTarget = { dayId: null, period: null };
      document.getElementById('modal-title').textContent = 'Edit activity';
      document.getElementById('f-title').value = m.title;
      document.getElementById('f-note').value = m.note || '';
      document.getElementById('f-start').value = m.start || '';
      document.getElementById('f-end').value = m.end || '';
      document.getElementById('f-type').value = m.type;
      document.getElementById('f-period').value = (m.period === 'pm') ? 'pm' : 'am';
      document.getElementById('modal').classList.add('show');
      document.getElementById('f-title').focus();
    }

    function openAddModal(dayId, period) {
      editingId = null;
      addTarget = { dayId, period: period || 'am' };
      document.getElementById('modal-title').textContent = 'Add activity';
      document.getElementById('f-title').value = '';
      document.getElementById('f-note').value = '';
      document.getElementById('f-start').value = '';
      document.getElementById('f-end').value = '';
      document.getElementById('f-type').value = 'nature';
      document.getElementById('f-period').value = period === 'pm' ? 'pm' : 'am';
      document.getElementById('modal').classList.add('show');
      document.getElementById('f-title').focus();
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
      editingId = null;
    }

    function saveMemo() {
      const title = document.getElementById('f-title').value.trim();
      if (!title) { showToast('Title is required'); return; }
      const note = document.getElementById('f-note').value.trim();
      const type = document.getElementById('f-type').value;
      const start = document.getElementById('f-start').value;
      const end = document.getElementById('f-end').value;
      const period = document.getElementById('f-period').value;

      if (editingId) {
        const m = memos.find(x => x.id === editingId);
        if (m) {
          m.title = title;
          m.note = note;
          m.type = type;
          m.start = start;
          m.end = end;
          if (m.dayId !== 'pool') m.period = period;
        }
      } else {
        const newMemo = {
          id: uid(),
          dayId: addTarget.dayId,
          period: addTarget.period === 'pool' ? 'pool' : (period || addTarget.period),
          title, note, type, start, end
        };
        if (addTarget.dayId === 'pool') {
          newMemo.dayId = 'pool';
          newMemo.period = 'pool';
        }
        memos.push(newMemo);
      }
      saveState();
      closeModal();
      renderBoard();
      showToast(editingId ? 'Updated' : 'Added');
    }

    function deleteMemo(id) {
      if (!confirm('Delete this activity?')) return;
      memos = memos.filter(m => m.id !== id);
      saveState();
      renderBoard();
      showToast('Deleted');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1800);
    }

    function resetBoard() {
      if (!confirm('Reset to the default 7-day plan? Your changes will be lost.')) return;
      memos = JSON.parse(JSON.stringify(DEFAULT_MEMOS));
      planLength = 7;
      days = buildDaysFromLength(7);
      syncDayTitles();
      saveState();
      renderBoard();
      showToast('Reset to default');
    }

    function buildSummaryText() {
      const lines = [];
      lines.push(planLength === 8 ? '🇮🇸 Iceland 8-Day Plan' : '🇮🇸 Iceland 7-Day Plan');
      lines.push('─'.repeat(28));

      days.forEach(day => {
        lines.push('');
        lines.push(`Day ${day.num} · ${day.title}`);
        if (day.sub) lines.push(`  (${day.sub})`);

        PERIODS.forEach(period => {
          const list = sortByIdSequence(
            memos.filter(m => m.dayId === day.id && m.period === period.id)
          );
          if (!list.length) return;
          lines.push(`  ${period.id.toUpperCase()}`);
          list.forEach(m => {
            const t = formatTimeRange(m.start, m.end);
            const timeBit = t ? ` [${t}]` : '';
            const noteBit = m.note ? ` — ${m.note}` : '';
            lines.push(`  • ${m.title}${timeBit}${noteBit}`);
          });
        });
      });

      const pool = sortByIdSequence(memos.filter(m => m.dayId === 'pool'));
      lines.push('');
      lines.push('📋 Unassigned');
      if (pool.length) {
        pool.forEach(m => {
          const noteBit = m.note ? ` — ${m.note}` : '';
          lines.push(`  • ${m.title}${noteBit}`);
        });
      } else {
        lines.push('  (none)');
      }

      lines.push('');
      lines.push('─'.repeat(28));
      return lines.join('\n');
    }

    function exportSummary() {
      document.getElementById('summary-text').value = buildSummaryText();
      document.getElementById('summary-modal').classList.add('show');
    }
    function closeSummaryModal() {
      document.getElementById('summary-modal').classList.remove('show');
    }
    async function copySummary() {
      const text = document.getElementById('summary-text').value;
      try {
        await navigator.clipboard.writeText(text);
        showToast('Copied to clipboard');
      } catch (e) {
        document.getElementById('summary-text').select();
        try {
          document.execCommand('copy');
          showToast('Copied to clipboard');
        } catch (e2) {
          showToast('Select text and copy manually');
        }
      }
    }

    function openImportModal() {
      document.getElementById('import-text').value = '';
      document.getElementById('import-modal').classList.add('show');
      document.getElementById('import-text').focus();
    }
    function closeImportModal() {
      document.getElementById('import-modal').classList.remove('show');
    }

    function parseTimeBit(s) {
      let start = '', end = '';
      const m = s.match(/\[([^\]]+)\]/);
      if (!m) return { start, end, rest: s };
      const inner = m[1].trim();
      const range = inner.match(/^(\d{1,2}:\d{2})\s*[–\-]\s*(\d{1,2}:\d{2})$/);
      if (range) {
        start = range[1];
        end = range[2];
      } else {
        const from = inner.match(/^from\s+(\d{1,2}:\d{2})$/i);
        const until = inner.match(/^until\s+(\d{1,2}:\d{2})$/i);
        if (from) start = from[1];
        if (until) end = until[1];
      }
      const rest = s.replace(m[0], '').trim();
      return { start, end, rest };
    }

    function guessType(title) {
      const t = title.toLowerCase();
      if (/land|transfer|flybus|departure|return|airport|kef|drive|pickup|drop/.test(t)) return 'drive';
      if (/lunch|dinner|breakfast|food|mokka|cafe|kaffi|roasters/.test(t)) return 'food';
      if (/museum|church|hallgr|harpa|walk|city|cinema|tó nar|12 tónar|paradís|phallolog/.test(t)) return 'culture';
      if (/hotel|free|recovery|bookstore|zimsen|vesturb|roasters/.test(t)) return 'relax';
      if (/★|waterfall|glacier|beach|cave|golden|northern|coast|lagoon|diamond|geysir|gullfoss/.test(t)) return 'nature';
      return 'culture';
    }

    function parseSummary(text) {
      const lines = text.replace(/\r\n/g, '\n').split('\n');
      const newDays = [];
      const newMemos = [];
      let currentDay = null;
      let currentPeriod = 'am';
      let inUnassigned = false;

      for (let raw of lines) {
        const line = raw.replace(/\s+$/, '');
        if (!line.trim() || /^[─\-═]+$/.test(line.trim())) continue;
        if (/Iceland\s+\d+-Day/i.test(line) || line.includes('🇮🇸')) continue;

        if (/Unassigned/i.test(line)) {
          inUnassigned = true;
          currentDay = null;
          continue;
        }
        if (inUnassigned && /^\s*\(none\)\s*$/i.test(line)) continue;

        const dayMatch = line.match(/^Day\s+(\d+)\s*[·•.\-]\s*(.+)$/i);
        if (dayMatch) {
          inUnassigned = false;
          const dayCounter = parseInt(dayMatch[1], 10);
          const fullTitle = dayMatch[2].trim();
          const label = stripDateFromTitle(fullTitle);
          let id = 'd' + dayCounter;
          if (/extra/i.test(label) || /free\s*\/\s*flexible/i.test(label)) id = 'd-extra';
          else if (/departure/i.test(label)) id = 'd7';
          else if (/south\s*coast\s*d1/i.test(label)) id = 'd2';
          else if (/south\s*coast\s*d2/i.test(label)) id = 'd3';
          else if (/arrival/i.test(label)) id = 'd1';
          else if (dayCounter <= 6) id = 'd' + dayCounter;

          currentDay = { id, num: dayCounter, title: fullTitle, label, sub: '' };
          if (newDays.some(d => d.id === id)) {
            id = 'd-imp-' + dayCounter + '-' + Math.random().toString(36).slice(2, 5);
            currentDay.id = id;
          }
          newDays.push(currentDay);
          currentPeriod = 'am';
          continue;
        }

        const subMatch = line.match(/^\s*\((.+)\)\s*$/);
        if (subMatch && currentDay && !inUnassigned) {
          currentDay.sub = subMatch[1].trim();
          continue;
        }

        if (/^\s*AM\s*$/i.test(line)) { currentPeriod = 'am'; continue; }
        if (/^\s*PM\s*$/i.test(line)) { currentPeriod = 'pm'; continue; }

        const bullet = line.match(/^\s*[•\-\*]\s+(.+)$/);
        if (bullet) {
          let body = bullet[1].trim();
          let note = '';
          const emDash = body.indexOf(' — ');
          if (emDash > 0) {
            const before = body.slice(0, emDash);
            if (!before.includes('[') || before.includes(']')) {
              note = body.slice(emDash + 3).trim();
              body = before.trim();
            }
          }
          const { start, end, rest } = parseTimeBit(body);
          let title = rest.replace(/\s*[—–]\s*$/, '').trim();
          if (!title) continue;
          newMemos.push({
            id: uid(),
            dayId: inUnassigned ? 'pool' : (currentDay ? currentDay.id : 'pool'),
            period: inUnassigned ? 'pool' : currentPeriod,
            title, note,
            type: guessType(title),
            start, end
          });
        }
      }

      if (!newDays.length) throw new Error('No days found. Paste a full exported summary.');

      const used = new Set();
      newDays.forEach((d, i) => {
        d.num = i + 1;
        if (!d.label) d.label = stripDateFromTitle(d.title);
        if (used.has(d.id)) d.id = 'd-imp-' + d.num;
        used.add(d.id);
      });
      ensureSouthCoastPairOrder(newDays);
      newDays.forEach((d, i) => {
        d.num = i + 1;
        d.title = dateForDayNum(d.num) + ' · ' + (d.label || stripDateFromTitle(d.title));
      });

      return { days: newDays, memos: newMemos };
    }

    function importSummary() {
      const text = document.getElementById('import-text').value.trim();
      if (!text) { showToast('Paste a summary first'); return; }
      try {
        const parsed = parseSummary(text);
        if (!confirm('Replace the current plan with the imported summary?')) return;
        days = parsed.days;
        memos = parsed.memos;
        planLength = days.length >= 8 ? 8 : 7;
        ensureSouthCoastPairOrder();
        syncDayTitles();
        saveState();
        closeImportModal();
        renderBoard();
        showToast('Imported ' + days.length + ' days, ' + memos.length + ' activities');
      } catch (e) {
        console.error(e);
        showToast(e.message || 'Import failed');
      }
    }

    /* —— Horizontal scrollbar sync —— */
    function updateHScrollSpacer() {
      const board = document.getElementById('board');
      const spacer = document.getElementById('board-hscroll-spacer');
      const wrap = document.getElementById('board-wrap');
      if (!board || !spacer || !wrap) return;
      const w = Math.max(board.scrollWidth, wrap.clientWidth + 1);
      spacer.style.width = w + 'px';
    }

    function bindScrollSync() {
      const wrap = document.getElementById('board-wrap');
      const track = document.getElementById('board-hscroll-track');
      wrap.addEventListener('scroll', () => {
        if (syncingScroll) return;
        syncingScroll = true;
        track.scrollLeft = wrap.scrollLeft;
        syncingScroll = false;
      });
      track.addEventListener('scroll', () => {
        if (syncingScroll) return;
        syncingScroll = true;
        wrap.scrollLeft = track.scrollLeft;
        syncingScroll = false;
      });
      window.addEventListener('resize', updateHScrollSpacer);
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeModal();
        closeSummaryModal();
        closeImportModal();
      }
    });
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target.id === 'modal') closeModal();
    });
    document.getElementById('summary-modal').addEventListener('click', e => {
      if (e.target.id === 'summary-modal') closeSummaryModal();
    });
    document.getElementById('import-modal').addEventListener('click', e => {
      if (e.target.id === 'import-modal') closeImportModal();
    });

    async function exportImage() {
      showToast('Rendering image…');
      const board = document.getElementById('board');
      const wrap = document.getElementById('board-wrap');
      const cols = Array.from(board.querySelectorAll('.day-col'));

      const prev = {
        wrapH: wrap.style.height,
        wrapO: wrap.style.overflow,
        boardDisplay: board.style.display,
        boardFlexDir: board.style.flexDirection,
        boardFlexWrap: board.style.flexWrap,
        boardMinW: board.style.minWidth,
        boardW: board.style.width,
        boardGap: board.style.gap,
        colStyles: cols.map(c => ({
          w: c.style.width,
          maxW: c.style.maxWidth,
          flex: c.style.flex
        }))
      };

      const COL_W = 240;
      const GAP = 10;
      const COLS_PER_ROW = 3;
      const boardW = COLS_PER_ROW * COL_W + (COLS_PER_ROW - 1) * GAP;

      wrap.style.height = 'auto';
      wrap.style.overflow = 'visible';
      board.style.display = 'flex';
      board.style.flexDirection = 'row';
      board.style.flexWrap = 'wrap';
      board.style.minWidth = '0';
      board.style.width = boardW + 'px';
      board.style.gap = GAP + 'px';
      cols.forEach(col => {
        col.style.width = COL_W + 'px';
        col.style.maxWidth = COL_W + 'px';
        col.style.flex = '0 0 ' + COL_W + 'px';
      });
      void board.offsetHeight;
      board.style.minHeight = board.scrollHeight + 'px';

      try {
        const canvas = await html2canvas(board, {
          backgroundColor: '#0b1220',
          scale: 2,
          useCORS: true,
          logging: false,
          width: boardW,
          windowWidth: boardW,
          windowHeight: board.scrollHeight
        });
        const a = document.createElement('a');
        a.download = 'iceland-plan-timetable.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
        showToast('PNG downloaded');
      } catch (e) {
        console.error(e);
        showToast('Image export failed');
      } finally {
        wrap.style.height = prev.wrapH;
        wrap.style.overflow = prev.wrapO;
        board.style.display = prev.boardDisplay;
        board.style.flexDirection = prev.boardFlexDir;
        board.style.flexWrap = prev.boardFlexWrap;
        board.style.minWidth = prev.boardMinW;
        board.style.width = prev.boardW;
        board.style.gap = prev.boardGap;
        cols.forEach((col, i) => {
          if (prev.colStyles[i]) {
            col.style.width = prev.colStyles[i].w;
            col.style.maxWidth = prev.colStyles[i].maxW;
            col.style.flex = prev.colStyles[i].flex;
          }
        });
      }
    }

    document.getElementById('pool-slot').addEventListener('dragover', onDragOver);
    document.getElementById('pool-slot').addEventListener('dragleave', onDragLeave);
    document.getElementById('pool-slot').addEventListener('drop', onDrop);

    loadState();
    renderBoard();
    bindScrollSync();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
